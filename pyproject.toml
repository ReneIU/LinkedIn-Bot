[project]
name = "linkedin-bot"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "ReneIU", email = "ReneSchomburg@googlemail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pyrefly>=1.3.1",
    "ruff>=0.16.8",
]

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]

[project.scripts]
linkedin-bot = "linkedin_bot:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
